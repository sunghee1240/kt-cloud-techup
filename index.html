let revealObserver;
function motion(){
  revealObserver?.disconnect();
  if(!('IntersectionObserver' in window)||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  revealObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{
    if(!entry.isIntersecting)return;
    entry.target.animate([{opacity:.25,transform:'translateY(18px)'},{opacity:1,transform:'translateY(0)'}],{duration:640,easing:'cubic-bezier(.16,1,.3,1)'});
    entry.target.querySelectorAll('.panel,.journey-step,.sales-card,.career-card').forEach((child,i)=>{
      child.animate([{opacity:.4,transform:'translateY(10px)'},{opacity:1,transform:'translateY(0)'}],{duration:480,delay:Math.min(i,4)*45,easing:'cubic-bezier(.16,1,.3,1)'});
    });
    revealObserver.unobserve(entry.target);
  }),{threshold:0.08});
  app.querySelectorAll('.section-grid,.process-step,.training-files,.work24-card,.result-deliverables').forEach(el=>revealObserver.observe(el));
}
